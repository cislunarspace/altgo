name: Release

on:
  push:
    tags: ["v*"]

# 除创建 GitHub Release 外，其余 job 均只读取仓库内容。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: 校验发布元数据
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 Tag 与版本
        run: bash packaging/scripts/validate-release.sh

  test:
    name: Run tests (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cargo workspace 在 src-tauri；保留默认 job 隔离，避免 debug 测试缓存抢占
      # release 打包缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      - uses: ./.github/actions/setup-linux-build

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

  build-linux:
    name: 构建 Linux 软件包 (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # release 打包单独缓存同架构的 release 依赖编译产物。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      - uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: "rpm"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 同一架构的 deb/rpm 共享一次前端和 Rust 构建，只在 bundle 阶段分别打包。
      # Tauri CLI 用 npm 版（预编译二进制），免去每个 job 源码编译 tauri-cli。
      - name: 构建 deb 与 rpm
        run: npm --prefix frontend exec -- tauri build --bundles deb,rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Linux 软件包产物
        uses: actions/upload-artifact@v4
        with:
          name: altgo-${{ matrix.arch }}-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  gen-aur:
    name: Generate AUR PKGBUILD
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: altgo-*-packages
          path: package-artifact
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate PKGBUILD
        run: |
          mapfile -t debs < <(find package-artifact -type f -name '*.deb' | sort)
          if [[ "${#debs[@]}" -ne 2 ]]; then
            echo "错误：预期恰好两份 deb 产物，实际找到 ${#debs[@]} 份" >&2
            printf '%s\n' "${debs[@]}" >&2
            exit 1
          fi
          AMD64_DEB="$(find package-artifact -name '*_amd64.deb' -type f -print -quit)"
          ARM64_DEB="$(find package-artifact -name '*_arm64.deb' -type f -print -quit)"
          if [[ -z "${AMD64_DEB}" || -z "${ARM64_DEB}" ]]; then
            echo "错误：必须同时包含 amd64 与 arm64 的 deb 产物" >&2
            exit 1
          fi
          mkdir -p aur-output
          cd aur-output
          bash ../packaging/aur/generate-pkgbuild.sh "${{ steps.version.outputs.value }}" "$(pwd)/../${AMD64_DEB}" "$(pwd)/../${ARM64_DEB}"

      - name: Upload AUR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: altgo-aur-pkgbuild
          path: |
            aur-output/PKGBUILD
            aur-output/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Create Release
    needs: [build-linux, gen-aur]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write release notes from CHANGELOG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/extract-release-notes.sh release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 校验发布产物
        run: |
          mapfile -t debs < <(find release-assets -type f -name '*.deb' | sort)
          mapfile -t rpms < <(find release-assets -type f -name '*.rpm' | sort)
          if [[ "${#debs[@]}" -ne 2 || "${#rpms[@]}" -ne 2 ]]; then
            echo "错误：预期两份 deb 和两份 rpm，实际为 ${#debs[@]} 份 deb、${#rpms[@]} 份 rpm" >&2
            find release-assets -type f | sort >&2
            exit 1
          fi
          printf '发布产物：\n%s\n' "$(find release-assets -type f | sort)"

      - name: Generate checksums
        run: |
          cd release-assets
          find . -type f \( -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z | xargs -0 sha256sum > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/PKGBUILD
            release-assets/.SRCINFO
            checksums.txt
