name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Run tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release-test

      - uses: ./.github/actions/setup-linux-build

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

  build-deb:
    name: Build DEB (${{ matrix.arch }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release-deb

      - uses: ./.github/actions/setup-linux-build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build deb
        run: cargo tauri build --bundles deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: altgo-${{ matrix.arch }}-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release-rpm

      - uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: 'rpm'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build rpm
        run: cargo tauri build --bundles rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: altgo-${{ matrix.arch }}-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  gen-aur:
    name: Generate AUR PKGBUILD
    needs: [build-deb]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: altgo-*-deb
          path: deb-artifact
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate PKGBUILD
        run: |
          echo "Contents of deb-artifact:"
          find deb-artifact -type f || true
          AMD64_DEB=$(find deb-artifact -name '*_amd64.deb' -type f | head -1)
          ARM64_DEB=$(find deb-artifact -name '*_arm64.deb' -type f | head -1)
          echo "Found amd64 deb: ${AMD64_DEB}"
          echo "Found arm64 deb: ${ARM64_DEB}"
          if [[ -z "${AMD64_DEB}" || -z "${ARM64_DEB}" ]]; then
            echo "ERROR: both amd64 and arm64 deb artifacts are required"
            exit 1
          fi
          mkdir -p aur-output
          cd aur-output
          bash ../packaging/aur/generate-pkgbuild.sh "${{ steps.version.outputs.value }}" "$(pwd)/../${AMD64_DEB}" "$(pwd)/../${ARM64_DEB}"

      - name: Upload AUR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: altgo-aur-pkgbuild
          path: |
            aur-output/PKGBUILD
            aur-output/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Create Release
    needs: [build-deb, build-rpm, gen-aur]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write release notes from CHANGELOG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/extract-release-notes.sh release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Generate checksums
        run: |
          cd release-assets
          find . -type f \( -name '*.deb' -o -name '*.rpm' \) -exec sha256sum {} \; > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release-assets/*
            checksums.txt
