name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支的新提交无需等待旧提交完成，避免重复占用双架构 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    # 与 release Linux 构建一致，避免仅在较新 runner 上能通过、deb 在 22.04 上 GLIBC 不兼容
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cargo workspace 在 src-tauri；默认的根目录 target/ 不存在，必须显式指定。
      # 保留 rust-cache 默认的 job 隔离，避免 debug 测试缓存抢占 release 打包缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      # 系统依赖统一在 composite action 里装；Tauri CLI 用 npm 版（见下方构建步骤）。
      # 多装 rpm 使 apt 缓存 key 与 release 构建一致：master 每次 push 都在为
      # release 预热缓存，避免发版时缓存未命中、走慢速镜像全量下载（实测卡 20+ 分钟）。
      - uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 前端测试、fmt 和 Clippy 不依赖目标架构，单跑一次即可；两个架构仍会
      # 分别执行测试和实际 deb 打包，覆盖各自的编译及链接路径。
      - name: Run frontend tests
        if: matrix.arch == 'amd64'
        run: npm test
        working-directory: frontend

      - name: Check formatting
        if: matrix.arch == 'amd64'
        run: cargo fmt --manifest-path=src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        if: matrix.arch == 'amd64'
        run: cargo clippy --manifest-path=src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

      - name: Build Tauri GUI
        run: npm --prefix frontend exec -- tauri build --bundles deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-windows:
    name: Check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

      - name: Build Tauri GUI
        run: npm --prefix frontend exec -- tauri build --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
