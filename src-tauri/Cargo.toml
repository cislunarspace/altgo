[package]
name = "altgo-tauri"
version = "2.5.8"
edition = "2021"
description = "altgo Tauri desktop application"

[lib]
name = "altgo_tauri"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "altgo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread", "process"] }
tracing = "0.1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
dirs = "5"
futures-util = "0.3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
regex = "1"
thiserror = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.5"

[dev-dependencies]
mockito = "1"
tempfile = "3"
